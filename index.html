<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{background:#181b1f;color:#e5e7eb;font-family:Arial,sans-serif;font-size:12px;margin:0;padding:0;height:100vh;display:flex;flex-direction:column}
.top{background:#22262c;padding:6px 10px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #323842;flex-wrap:wrap}
.brand{color:#f97316;font-weight:bold;font-size:14px;margin-right:8px}
select,input,button{background:#2d333b;color:#fff;border:1px solid #444c56;padding:5px 8px;border-radius:3px;font-size:11px}
button{cursor:pointer;font-weight:bold}
.btn-or{background:#d97706;border-color:#f59e0b;color:#fff}
.btn-bl{background:#0284c7;border-color:#38bdf8;color:#fff}
.btn-gr{background:#16a34a;border-color:#4ade80;color:#fff}
.main{display:flex;flex:1;overflow:hidden}
.left{flex:1.4;overflow-y:auto;padding:8px;border-right:1px solid #323842}
.right{flex:1;overflow-y:auto;padding:8px;background:#1c2026;display:flex;flex-direction:column}
.controls{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.lg-head{background:#2b6cb0;color:#fff;padding:5px 8px;font-weight:bold;margin-top:8px;border-radius:3px 3px 0 0;font-size:11px}
.row{background:#374151;padding:6px 8px;border-bottom:1px solid #1f2428;display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer}
.row:hover{background:#4b5563}
.row.warn{border-left:3px solid #f59e0b;background:#3f3a32}
.row.picked{outline:2px solid #f97316;background:#4338ca}
.m-title{display:flex;align-items:center;gap:6px;flex:1;min-width:140px}
.badges{display:flex;gap:3px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 6px;border-radius:2px;font-weight:bold;color:#fff}
.rb{background:#0ea5e9}.bg{background:#22c55e}.ns{background:#f97316}.br{background:#a855f7}
.days{display:flex;gap:4px;margin-bottom:8px;border-bottom:1px solid #323842;padding-bottom:6px;overflow-x:auto}
.day-tab{background:#2d333b;padding:5px 12px;border-radius:3px;color:#9ca3af}
.day-tab.act{background:#d97706;color:#fff}
.pair-box{background:#262b33;border:1px solid #3d444f;border-radius:4px;padding:12px;text-align:center;margin-bottom:10px}
.vs-card{background:#181b1f;padding:10px;border-radius:4px;margin:8px 0;border:1px dashed #f97316}
.cand-row{background:#2d333b;padding:7px;margin-bottom:4px;border-radius:3px;display:flex;justify-content:space-between;align-items:center}
@media(max-width:768px){.main{flex-direction:column}.left,.right{flex:none;height:50%}}
</style>
</head>
<body>

<div class="top">
  <span class="brand">MFCMetaWeb Clone</span>
  <select id="sp" onchange="render()">
    <option value="Soccer">Soccer</option>
    <option value="Basketball">Basketball</option>
  </select>
  <button id="sortBtn" class="btn-or" onclick="toggleSort()">Sort by League</button>
  <button id="warnBtn" onclick="toggleWarn()">Show all</button>
  <input type="text" id="q" placeholder="Search team or league..." oninput="render()" style="flex:1;min-width:120px">
  <button class="btn-bl" onclick="autoPair()">System Auto-Pair</button>
  <button class="btn-gr" onclick="loadLive()">↻ Sync Feeds</button>
</div>

<div class="main">
  <div class="left">
    <div id="status" style="font-size:11px;color:#9ca3af;margin-bottom:4px">Initializing feeds...</div>
    <div id="feedList"></div>
  </div>

  <div class="right">
    <div class="days" id="dayTabs"></div>
    <div class="pair-box">
      <div style="font-weight:bold;color:#f97316;margin-bottom:4px">JOIN VIEW / MANUAL MAPPING</div>
      <div id="joinWorkspace">
        <p style="color:#9ca3af;font-size:11px">Pumili ng laro sa kaliwa (lalo na ang may orange warning line) para ipares sa katapat nitong provider feed.</p>
      </div>
    </div>
    <div style="font-weight:bold;font-size:11px;margin-bottom:5px;color:#9ca3af">UNPAIRED CANDIDATES (Click to Pair)</div>
    <div id="candidates"></div>
  </div>
</div>

<script>
let events = [];
let selectedDay = 'All';
let sortMode = 'league';
let onlyWarning = false;
let activeId = null;

const provNames = { rb: 'RunningBall', bg: 'Betgenius', ns: 'Newsports_1x', br: 'Betradar' };
const cleanName = s => s.toLowerCase().replace(/\b(fc|cf|sc|ac|united|utd|city|club|de|cd|ca)\b/g, '').replace(/[^a-z0-9]/g, '');

function getISO(offset) {
  let d = new Date();
  d.setDate(d.getDate() + offset);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function fmtDate(dStr, tStr) {
  let dt = new Date((dStr || getISO(0)) + 'T' + (tStr || '12:00:00') + 'Z');
  if (isNaN(dt)) return { d: 'Fri, 20.11', tm: '20:00' };
  let d = dt.toLocaleDateString('en-US', { timeZone: 'Asia/Manila', weekday: 'short' }) + ', ' +
          dt.toLocaleDateString('en-GB', { timeZone: 'Asia/Manila', day: '2-digit', month: '2-digit' }).replace('/', '.');
  let tm = dt.toLocaleTimeString('en-GB', { timeZone: 'Asia/Manila', hour: '2-digit', minute: '2-digit' });
  return { d, tm };
}

function toggleSort() {
  sortMode = sortMode === 'league' ? 'time' : 'league';
  document.getElementById('sortBtn').innerText = sortMode === 'league' ? 'Sort by League' : 'Sort by Time';
  render();
}

function toggleWarn() {
  onlyWarning = !onlyWarning;
  let b = document.getElementById('warnBtn');
  b.innerText = onlyWarning ? 'Only warning' : 'Show all';
  b.className = onlyWarning ? 'btn-or' : '';
  render();
}

function buildFallback() {
  let d0 = fmtDate(getISO(0), '13:00:00').d;
  let d1 = fmtDate(getISO(1), '13:00:00').d;
  return [
    { id: 'm1', d: d0, tm: '09:00', l: 'Mexico - Liga MX', s: 'Soccer', t: 'Club Tijuana vs Atlante FC', p: ['rb', 'bg', 'ns'] },
    { id: 'm2', d: d0, tm: '11:00', l: 'Mexico - Liga MX', s: 'Soccer', t: 'FC Juarez vs FC Atlas', p: ['rb', 'bg', 'ns'] },
    { id: 'm3', d: d0, tm: '19:30', l: 'Montenegro - Second League', s: 'Soccer', t: 'FK Jedinstvo Bijelo Polje vs FK Kom Podgorica', p: ['rb'] },
    { id: 'm4', d: d0, tm: '19:30', l: 'Montenegro - Second League', s: 'Soccer', t: 'Jedinstvo Bijelo Polje vs Kom Podgorica', p: ['ns', 'br'] },
    { id: 'm5', d: d0, tm: '21:00', l: 'Morocco - Botola 2', s: 'Soccer', t: 'Chabab Atlas Khenifra vs Olympique Dcheira', p: ['rb'] },
    { id: 'm6', d: d0, tm: '21:00', l: 'Morocco - Botola 2', s: 'Soccer', t: 'CA Khenifra vs Ol. Dcheira', p: ['bg'] },
    { id: 'm7', d: d1, tm: '02:00', l: 'Netherlands - Eerste Divisie', s: 'Soccer', t: 'Almere City FC vs NAC Breda', p: ['rb', 'bg', 'br'] },
    { id: 'm8', d: d1, tm: '02:00', l: 'Netherlands - Eerste Divisie', s: 'Soccer', t: 'FC Den Bosch vs VVV Venlo', p: ['rb'] },
    { id: 'm9', d: d1, tm: '02:00', l: 'Netherlands - Eerste Divisie', s: 'Soccer', t: 'Den Bosch vs VVV-Venlo', p: ['bg', 'ns'] },
    { id: 'b1', d: d0, tm: '08:30', l: 'USA - NBA', s: 'Basketball', t: 'San Antonio Spurs vs LA Clippers', p: ['rb', 'bg'] },
    { id: 'b2', d: d0, tm: '09:00', l: 'USA - NBA', s: 'Basketball', t: 'Memphis Grizzlies vs Golden State Warriors', p: ['rb'] },
    { id: 'b3', d: d0, tm: '09:00', l: 'USA - NBA', s: 'Basketball', t: 'Memphis Grizzlies vs GS Warriors', p: ['br', 'ns'] }
  ];
}

async function loadLive() {
  document.getElementById('status').innerText = 'Fetching live multifeed schedule...';
  let live = [];
  const d0 = getISO(0), d1 = getISO(1);
  const urls = [
    `https://thesportsdb.com{d0}&s=Soccer`,
    `https://thesportsdb.com{d1}&s=Soccer`,
    `https://thesportsdb.com{d0}&s=Basketball`,
    `https://thesportsdb.com{d1}&s=Basketball`
  ];
  for (let u of urls) {
    try {
      let r = await fetch(u);
      let j = await r.json();
      if (j.events) {
        j.events.slice(0, 12).forEach((e, idx) => {
          let info = fmtDate(e.dateEvent, e.strTime);
          if (idx % 3 === 0) {
            // Partially auto-paired by system
            live.push({ id: e.idEvent + '_a', d: info.d, tm: info.tm, l: e.strLeague, s: e.strSport, t: e.strEvent, p: ['rb', 'bg', 'ns'] });
          } else {
            // Left unpaired so user or System Auto-Pair can match them
            live.push({ id: e.idEvent + '_1', d: info.d, tm: info.tm, l: e.strLeague, s: e.strSport, t: e.strEvent, p: ['rb'] });
            live.push({ id: e.idEvent + '_2', d: info.d, tm: info.tm, l: e.strLeague, s: e.strSport, t: e.strEvent, p: [idx % 2 === 0 ? 'bg' : 'br', 'ns'] });
          }
        });
      }
    } catch (err) {}
  }
  events = live.length ? live : buildFallback();
  document.getElementById('status').innerText = live.length
    ? `Live API Synced: ${events.length} events loaded.`
    : `Loaded ${events.length} multifeed events (Ready for Pairing).`;
  render();
}

function selectMatch(id) {
  activeId = id;
  render();
}

function manualPair(targetId) {
  if (!activeId || activeId === targetId) return;
  let mainItem = events.find(x => x.id === activeId);
  let targetItem = events.find(x => x.id === targetId);
  if (!mainItem || !targetItem) return;

  mainItem.p = [...new Set([...mainItem.p, ...targetItem.p])];
  events = events.filter(x => x.id !== targetId);
  render();
}

function autoPair() {
  let map = {};
  events.forEach(ev => {
    let key = ev.d + '|' + ev.s + '|' + cleanName(ev.t);
    if (map[key]) {
      map[key].p = [...new Set([...map[key].p, ...ev.p])];
    } else {
      map[key] = { ...ev, p: [...ev.p] };
    }
  });
  events = Object.values(map);
  activeId = null;
  document.getElementById('status').innerText = 'System Auto-Pair completed!';
  render();
}

function render() {
  let sp = document.getElementById('sp').value;
  let q = document.getElementById('q').value.toLowerCase();

  // Render Day Tabs on Right Panel
  let days = ['All', ...new Set(events.filter(x => x.s === sp).map(x => x.d))];
  document.getElementById('dayTabs').innerHTML = days.map(d =>
