<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#1f2428;color:#fff;font-family:sans-serif;font-size:13px;padding:8px;margin:0}
.bar,.days{display:flex;gap:5px;margin-bottom:7px;flex-wrap:wrap}
.days{overflow-x:auto;flex-wrap:nowrap}
input,select,button{background:#374151;color:#fff;border:none;padding:6px 8px;border-radius:4px;font-size:12px}
input[type=text]{flex:1;background:#111827;min-width:90px}
button{font-weight:bold;cursor:pointer;white-space:nowrap}
.act{background:#ea580c!important}
.box{background:#111827;padding:7px;border-radius:6px;margin-bottom:7px}
.lg{background:#0f766e;padding:5px 8px;font-weight:bold;margin-top:7px;border-radius:4px 4px 0 0}
.row{background:#374151;padding:7px;border-bottom:1px solid #1f2428;display:flex;justify-content:space-between;align-items:center}
.tag{font-size:10px;padding:2px 5px;border-radius:3px;margin-left:2px;font-weight:bold}
.rb{background:#0284c7}.bg{background:#16a34a}.ns{background:#f97316}.br{background:#9333ea}
</style>
</head>
<body>

<div class="bar">
  <b style="color:#f97316;align-self:center">SPORTS HUB</b>
  <select id="sp" onchange="show()"><option>Soccer</option><option>Basketball</option></select>
  <input type="text" id="q" placeholder="Search..." oninput="show()">
  <button style="background:#ea580c" onclick="pair()">Join(<span id="c">0</span>)</button>
  <button style="background:#0284c7" onclick="auto()">Auto-Pair</button>
  <button style="background:#16a34a" onclick="bulk()">+Data</button>
</div>

<div class="days" id="tabs"></div>

<div class="box">
  <div class="bar">
    <select id="nd"></select>
    <select id="np"><option value="rb">RunningBall</option><option value="bg">Betgenius</option><option value="br">Betradar</option><option value="ns">Newsports</option></select>
    <input type="text" id="nl" placeholder="League">
  </div>
  <div class="bar" style="margin:0">
    <input type="text" id="nm" placeholder="Match (Team A vs Team B)">
    <button style="background:#0f766e" onclick="add()">+Create</button>
  </div>
</div>

<div id="app"></div>

<script>
const wk=['All Week','Fri, 20.11','Sat, 21.11','Sun, 22.11','Mon, 23.11','Tue, 24.11','Wed, 25.11','Thu, 26.11'];
let day='All Week', sel=[], data=JSON.parse(localStorage.getItem('fd5'))||[];
const sv=()=>localStorage.setItem('fd5',JSON.stringify(data));
const nm={rb:'RunningBall',bg:'Betgenius',ns:'Newsports',br:'Betradar'};
const cln=s=>s.toLowerCase().replace(/\b(fc|cf|sc|ac|united|utd|city)\b/g,'').replace(/[^a-z0-9]/g,'');
document.getElementById('nd').innerHTML=wk.slice(1).map(d=>`<option>${d}</option>`).join('');

function add(){
  let t=document.getElementById('nm').value.trim(); if(!t)return;
  data.unshift({id:Date.now()+Math.random(),d:document.getElementById('nd').value,l:document.getElementById('nl').value||'League',s:document.getElementById('sp').value,t,p:[document.getElementById('np').value]});
  document.getElementById('nm').value=''; sv(); show();
}

function bulk(){
  const b=[
    ['Fri, 20.11','Mexico - Liga MX','Soccer','Club Tijuana vs Atlante','rb'],['Fri, 20.11','Mexico - Liga MX','Soccer','Club Tijuana vs Atlante FC','bg'],['Fri, 20.11','Mexico - Liga MX','Soccer','Club Tijuana vs Atlante','br'],
    ['Sat, 21.11','England - Premier League','Soccer','Arsenal FC vs Chelsea','rb'],['Sat, 21.11','England - Premier League','Soccer','Arsenal vs Chelsea FC','br'],
    ['Sun, 22.11','Spain - La Liga','Soccer','Real Madrid vs Barcelona','rb'],['Sun, 22.11','Spain - La Liga','Soccer','Real Madrid CF vs FC Barcelona','ns'],
    ['Fri, 20.11','Philippines - PBA','Basketball','Ginebra vs San Miguel','rb'],['Fri, 20.11','Philippines - PBA','Basketball','Ginebra vs San Miguel','br']
  ].map(([d,l,s,t,p],i)=>({id:Date.now()+i,d,l,s,t,p:[p]}));
  data=[...b,...data]; sv(); show();
}

function tog(id){ sel=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id]; document.getElementById('c').innerText=sel.length; }

function pair(){
  if(sel.length<2)return;
  let it=data.filter(x=>sel.includes(x.id));
  data=[{...it,id:Date.now(),p:[...new Set(it.flatMap(x=>x.p))]},...data.filter(x=>!sel.includes(x.id))];
  sel=[]; document.getElementById('c').innerText=0; sv(); show();
}

function auto(){
  let m={};
  data.forEach(x=>{ let k=x.d+'|'+x.s+'|'+cln(x.t); m[k]=m[k]?{...m[k],p:[...new Set([...m[k].p,...x.p])]}:{...x,p:[...x.p]}; });
  data=Object.values(m); sel=[]; document.getElementById('c').innerText=0; sv(); show();
}

function show(){
  document.getElementById('tabs').innerHTML=wk.map(d=>`<button class="${day==d?'act':''}" onclick="day='${d}';show()">${d}</button>`).join('');
  let sp=document.getElementById('sp').value, q=document.getElementById('q').value.toLowerCase(), h='';
  let f=data.filter(x=>x.s==sp&&(day=='All Week'||x.d==day)&&x.t.toLowerCase().includes(q));
  [...new Set(f.map(x=>x.l))].forEach(lg=>{
    h+=`<div class="lg">${lg}</div>`;
    f.filter(x=>x.l==lg).forEach(m=>{
      h+=`<div class="row"><div><input type="checkbox" ${sel.includes(m.id)?'checked':''} onchange="tog(${m.id})"> <small style="color:#9ca3af">[${m.d}]</small> ${m.t}</div><div>${m.p.map(c=>`<span class="tag ${c}">${nm[c]}</span>`).join('')}</div></div>`;
    });
  });
  document.getElementById('app').innerHTML=h;
}
if(!data.length)bulk(); else show();
</script>
</body>
</html>
